<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f472b6">
    <title>无可用衣橱 - Samantha的衣橱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:'#f472b6','primary-dark':'#db2777','primary-light':'#fce7f3'}}}}</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        *{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif}
        input{font-size:16px!important}
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-pink-50 to-purple-100 min-h-screen flex items-center justify-center" style="padding-bottom:env(safe-area-inset-bottom,16px)">
    <div class="w-full max-w-sm mx-4 text-center">
        <div class="text-6xl mb-4">👗</div>
        <div class="bg-white rounded-3xl p-6 shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-2">暂无可用衣橱</h2>
            <p class="text-gray-500 text-sm mb-4">你的账号尚未加入任何衣橱，请联系管理员将你添加到衣橱中。</p>
            <div class="text-xs text-gray-400 mb-4">当前账号：{{ current_user.display_name or current_user.username }}</div>
            <form method="post" action="/logout" class="inline-block">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="inline-block px-6 py-2.5 rounded-xl bg-pink-50 text-primary-dark font-medium text-sm hover:bg-pink-100 transition-colors">退出登录</button>
            </form>
        </div>
    </div>
</body>
</html>

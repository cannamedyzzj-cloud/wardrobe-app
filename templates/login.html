<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f472b6">
    <title>登录 - Samantha的衣橱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:'#f472b6','primary-dark':'#db2777','primary-light':'#fce7f3'}}}}</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        *{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif}
        input{font-size:16px!important}
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-pink-50 to-purple-100 min-h-screen flex items-center justify-center" style="padding-bottom:env(safe-area-inset-bottom,16px)">
    <div class="w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="text-6xl mb-3">👗</div>
            <h1 class="text-2xl font-bold text-primary-dark">Samantha的衣橱</h1>
        </div>
        <div class="bg-white rounded-3xl p-6 shadow-lg">
            {% if error %}<div class="bg-red-50 text-red-600 text-sm rounded-xl px-4 py-3 mb-4 text-center">{{ error }}</div>{% endif %}
            <form method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">用户名</label>
                    <input type="text" name="username" required placeholder="输入用户名" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">密码</label>
                    <input type="password" name="password" required placeholder="输入密码" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-primary">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-primary text-white font-bold hover:bg-primary-dark transition-colors">登 录</button>
            </form>
        </div>
    </div>
</body>
</html>

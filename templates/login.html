{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div style="min-height:60vh" class="flex items-center justify-center">
<div class="w-full max-w-sm">
<div class="text-center mb-8"><div class="text-5xl mb-4">👗</div><h1 class="text-2xl font-bold">Samantha的衣橱</h1></div>
<form method="post" class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
{% if error %}<div class="bg-red-50 text-red-500 text-sm rounded-xl p-3 text-center">{{ error }}</div>{% endif %}
<input type="text" name="username" required placeholder="用户名" class="w-full px-4 py-3 rounded-xl border text-sm outline-none focus:border-primary">
<input type="password" name="password" required placeholder="密码" class="w-full px-4 py-3 rounded-xl border text-sm outline-none focus:border-primary">
<button class="w-full py-3 bg-primary text-white rounded-xl font-medium">登录</button>
</form>
<p class="text-center text-sm text-gray-400 mt-4">没有账号？<a href="/register" class="text-primary font-medium">注册</a></p>
</div></div>
{% endblock %}

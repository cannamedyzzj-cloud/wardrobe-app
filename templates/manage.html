{% extends "base.html" %}
{% block title %}管理 - Samantha的衣橱{% endblock %}
{% block content %}

<h2 class="text-base font-bold text-gray-600 mb-3">📦 衣橱管理</h2>
<div class="grid gap-3 mb-6">
    <a href="/manage/categories" class="block bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow no-underline">
        <div class="flex items-center gap-4">
            <span class="text-3xl">📁</span>
            <div class="flex-1"><div class="font-bold text-gray-800">分类管理</div><div class="text-sm text-gray-400">{{ cat_count }} 个分类</div></div>
            <span class="text-gray-300">→</span>
        </div>
    </a>
    <a href="/manage/brands" class="block bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow no-underline">
        <div class="flex items-center gap-4">
            <span class="text-3xl">🏷️</span>
            <div class="flex-1"><div class="font-bold text-gray-800">品牌管理</div><div class="text-sm text-gray-400">{{ brand_count }} 个品牌</div></div>
            <span class="text-gray-300">→</span>
        </div>
    </a>
    <a href="/manage/colors" class="block bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow no-underline">
        <div class="flex items-center gap-4">
            <span class="text-3xl">🎨</span>
            <div class="flex-1"><div class="font-bold text-gray-800">颜色管理</div><div class="text-sm text-gray-400">{{ color_count }} 个颜色</div></div>
            <span class="text-gray-300">→</span>
        </div>
    </a>
    <a href="/manage/locations" class="block bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow no-underline">
        <div class="flex items-center gap-4">
            <span class="text-3xl">📍</span>
            <div class="flex-1"><div class="font-bold text-gray-800">位置管理</div><div class="text-sm text-gray-400">{{ loc_count }} 个位置</div></div>
            <span class="text-gray-300">→</span>
        </div>
    </a>
</div>

<h2 class="text-base font-bold text-gray-600 mb-3">💾 数据管理</h2>
<div class="grid gap-3">
    <a href="/export" class="block bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow no-underline">
        <div class="flex items-center gap-4">
            <span class="text-3xl">💾</span>
            <div class="flex-1"><div class="font-bold text-gray-800">数据备份</div><div class="text-sm text-gray-400">下载包含照片的完整备份包（ZIP）</div></div>
            <span class="text-gray-300">↓</span>
        </div>
    </a>
</div>
{% endblock %}

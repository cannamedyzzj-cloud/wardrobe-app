services:
  wardrobe:
    build: .
    image: samantha-wardrobe:${APP_VERSION:-1.0.0}
    ports:
      - "3000:3000"
    volumes:
      - /samantha-wardrobe/shared/data:/app/data
    env_file:
      - /samantha-wardrobe/shared/.env
    environment:
      - DATA_PATH=/app/data
      - DATABASE_URL=sqlite:////app/data/db/wardrobe.sqlite3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
